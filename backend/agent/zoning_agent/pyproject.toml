[project]
name = "zoning-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Syed Muhammad Rehan",email = "160617865+relinxx@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "langchain (>=1.0.2,<2.0.0)",
    "pdfplumber (>=0.11.7,<0.12.0)",
    "docx2txt (>=0.9,<0.10)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "langchain-community (>=0.4,<0.5)",
    "langchain-openai (>=1.0.1,<2.0.0)",
    "pypdf (>=6.1.3,<7.0.0)",
    "langchain-core (>=1.0.1,<2.0.0)",
    "chromadb (>=1.2.2,<2.0.0)",
    "langchain-chroma (>=1.0.0,<2.0.0)"
]

[tool.poetry]
# This subproject is consumed as part of backend/agent; disable package mode
# to avoid requiring a nonexistent `src/zoning_agent` package layout.
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
