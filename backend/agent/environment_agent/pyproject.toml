[project]
name = "environment-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Syed Muhammad Rehan",email = "160617865+relinxx@users.noreply.github.com"}
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "langchain (>=1.0.2,<2.0.0)",
    "pdfplumber (>=0.11.7,<0.12.0)",
    "docx2txt (>=0.9,<0.10)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "tiktoken (>=0.12.0,<0.13.0)",
    "langchain-community (>=0.4,<0.5)",
    "langchain-openai (>=1.0.1,<2.0.0)",
    "pypdf (>=6.1.3,<7.0.0)",
    "langchain-core (>=1.0.1,<2.0.0)",
    "chromadb (>=1.2.2,<2.0.0)",
    "langchain-chroma (>=1.0.0,<2.0.0)",
    "pandas (>=2.2,<3.0)",
    "geopandas (>=0.14,<0.15)",
    "scikit-learn (>=1.5,<2.0)",
    "xgboost (>=2.1,<3.0)",
    "shapely (>=2.0,<3.0)",
    "tifffile (>=2024.2,<2025.0)",
    "lxml (>=5.2,<6.0)",
    "numpy (>=1.26,<3.0)"
]

[tool.poetry]
# This subproject is used as an application module inside backend/agent.
# Disable wheel packaging mode to avoid invalid package-path resolution.
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
